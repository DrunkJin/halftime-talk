<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halftime Talk</title>
  <meta name="description" content="FM 스타일 축구 감독 시뮬레이션">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233ddc97'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/transitions.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
  <!-- 방문 통계 (Umami Cloud, 쿠키 없음). 배포 도메인에서만 집계 -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="70997f7e-1768-4d4f-8df6-0c1630fda83d" data-domains="drunkjin.github.io"></script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <span class="t-shimmer" data-text="데이터 불러오는 중">데이터 불러오는 중</span>
    </div>
  </div>
  <script>
    // 부팅 문구: 사전을 불러오기 전이라 js/i18n.js의 detectLang()과 같은 순서로 언어만 먼저 고른다
    (function () {
      var ok = function (l) { return l === 'ko' || l === 'en' ? l : null; };
      var lang = null;
      try {
        lang = ok(new URLSearchParams(location.search).get('lang')) || ok(localStorage.getItem('ht-lang'));
      } catch (e) {}
      if (!lang) lang = (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
      if (lang === 'ko') return;
      document.documentElement.lang = lang;
      var el = document.querySelector('.boot .t-shimmer');
      if (el) { el.textContent = 'Loading data'; el.setAttribute('data-text', 'Loading data'); }
    })();
  </script>
  <noscript>JavaScript를 켜야 플레이할 수 있습니다. · Enable JavaScript to play.</noscript>
</body>
</html>
